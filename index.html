<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NAVO Alfabet Trainer</title>
  <style>
    :root {
      --bg1: #0b1020;
      --bg2: #121a2f;
      --panel: rgba(255,255,255,0.07);
      --panel-border: rgba(255,255,255,0.12);
      --text: #f5f7fb;
      --muted: #aab4c8;
      --accent: #78a6ff;
      --accent2: #8ce1c2;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(70,110,200,0.20), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(70,180,150,0.16), transparent 35%),
        linear-gradient(145deg, var(--bg1), var(--bg2));
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .app {
      width: min(1100px, 92vw);
      min-height: 72vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 28px;
      border-radius: 28px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(14px);
      box-shadow: 0 25px 70px rgba(0,0,0,0.30);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
    }

    .title {
      min-width: 0;
      font-size: clamp(18px, 2vw, 26px);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .round {
      flex: 0 0 auto;
      white-space: nowrap;
      color: var(--muted);
      font-size: 14px;
    }

    .main {
      display: grid;
      place-items: center;
      align-content: center;
      gap: 42px;
      padding: 34px 0;
    }

    .letters {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: clamp(10px, 1.4vw, 20px);
      width: 100%;
    }

    .letter-card {
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
      font-size: clamp(42px, 7vw, 88px);
      font-weight: 800;
      letter-spacing: -0.03em;
      user-select: none;
    }

    .words {
      width: 100%;
      min-height: 74px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: clamp(10px, 1.4vw, 20px);
      opacity: 0;
      transform: translateY(8px);
      transition: 180ms ease;
    }

    .words.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .word {
      min-width: 0;
      text-align: center;
      font-size: clamp(16px, 2.2vw, 28px);
      color: var(--accent2);
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .hint {
      text-align: center;
      color: var(--muted);
      font-size: clamp(14px, 1.6vw, 18px);
      padding-top: 10px;
    }

    .key {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 8px;
      margin: 0 4px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text);
      font-weight: 700;
      box-shadow: 0 2px 0 rgba(0,0,0,0.25);
    }

    .tap-zone {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .app { position: relative; z-index: 1; }

    @media (max-width: 700px) {
      .app {
        width: calc(100vw - 20px);
        min-height: 82vh;
        padding: 20px 12px;
        border-radius: 22px;
      }

      .topbar {
        gap: 10px;
      }

      .title {
        font-size: clamp(17px, 5vw, 22px);
      }

      .round {
        font-size: clamp(12px, 3.8vw, 14px);
      }

      .letters, .words {
        width: 100%;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
      }

      .letter-card {
        min-width: 0;
        border-radius: 12px;
        font-size: clamp(28px, 10vw, 48px);
      }

      .word {
        font-size: clamp(11px, 3.2vw, 15px);
        line-height: 1.15;
      }

      .main {
        min-width: 0;
        gap: 24px;
      }

      .hint {
        font-size: clamp(13px, 3.8vw, 16px);
        line-height: 1.45;
      }

      .key {
        padding: 3px 8px;
      }
    }

    @media (max-width: 380px) {
      .app {
        padding-left: 10px;
        padding-right: 10px;
      }

      .letters, .words {
        gap: 5px;
      }

      .title {
        font-size: 16px;
      }

      .round {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="tap-zone" id="tapZone" aria-hidden="true"></div>

  <main class="app">
    <div class="topbar">
      <div class="title">NAVO-alfabet trainer</div>
      <div class="round" id="round">Ronde 1</div>
    </div>

    <section class="main">
      <div class="letters" id="letters"></div>
      <div class="words" id="words"></div>
    </section>

    <div class="hint" id="hint">
      Zeg de vijf woorden in gedachten en druk op <span class="key">Enter</span>
    </div>
  </main>

  <script>
    const nato = {
      A: "Alfa",
      B: "Bravo",
      C: "Charlie",
      D: "Delta",
      E: "Echo",
      F: "Foxtrot",
      G: "Golf",
      H: "Hotel",
      I: "India",
      J: "Juliett",
      K: "Kilo",
      L: "Lima",
      M: "Mike",
      N: "November",
      O: "Oscar",
      P: "Papa",
      Q: "Quebec",
      R: "Romeo",
      S: "Sierra",
      T: "Tango",
      U: "Uniform",
      V: "Victor",
      W: "Whiskey",
      X: "X-ray",
      Y: "Yankee",
      Z: "Zulu"
    };

    let currentLetters = [];
    let showingAnswers = false;
    let round = 1;

    const lettersEl = document.getElementById("letters");
    const wordsEl = document.getElementById("words");
    const hintEl = document.getElementById("hint");
    const roundEl = document.getElementById("round");

    function chooseFive() {
      const pool = Object.keys(nato);
      const picked = [];

      while (picked.length < 5) {
        const i = Math.floor(Math.random() * pool.length);
        picked.push(pool.splice(i, 1)[0]);
      }
      return picked;
    }

    function renderRound() {
      showingAnswers = false;

      // Verberg de antwoorden eerst, vóórdat nieuwe inhoud wordt geplaatst.
      // Dit voorkomt dat de oplossing van de nieuwe ronde één frame zichtbaar is.
      wordsEl.classList.remove("visible");
      wordsEl.style.transition = "none";
      wordsEl.style.opacity = "0";
      wordsEl.style.transform = "translateY(8px)";

      currentLetters = chooseFive();

      lettersEl.innerHTML = currentLetters
        .map(letter => `<div class="letter-card">${letter}</div>`)
        .join("");

      wordsEl.innerHTML = currentLetters
        .map(letter => `<div class="word">${nato[letter]}</div>`)
        .join("");

      // Forceer eerst de verborgen toestand; daarna mogen animaties weer aan.
      void wordsEl.offsetHeight;
      wordsEl.style.transition = "";
      wordsEl.style.opacity = "";
      wordsEl.style.transform = "";

      roundEl.textContent = `Ronde ${round}`;
      hintEl.innerHTML = 'Zeg de vijf woorden in gedachten en druk op <span class="key">Enter</span>';
    }

    function advance() {
      if (!showingAnswers) {
        showingAnswers = true;
        wordsEl.classList.add("visible");
        hintEl.innerHTML = 'Controleer jezelf en druk opnieuw op <span class="key">Enter</span>';
      } else {
        round += 1;
        renderRound();
      }
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.code === "Space") {
        event.preventDefault();
        advance();
      }
    });

    document.addEventListener("click", () => {
      advance();
    });

    renderRound();
  </script>
</body>
</html>
